<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Rayhendra Hanif</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <!-- Root-relative paths: GitHub Pages serves this file for any missing URL -->
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 48px 16px; }
    .not-found .code { font-family: var(--font-serif); font-size: clamp(4rem, 18vw, 8rem); font-weight: 700; line-height: 1; color: var(--accent); }
    .not-found p { margin-top: 12px; color: var(--text-muted); }
    .not-found .btn { margin-top: 28px; }
  </style>
</head>
<body>
  <main class="not-found">
    <div>
      <p class="code">404</p>
      <h1 class="section-title">This page flatlined</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a class="btn btn-primary" href="/">Back to the homepage</a>
    </div>
  </main>
</body>
</html>
